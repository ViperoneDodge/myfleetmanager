name: Compila APK Android

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: stable
          cache: true

      - name: Prepara progetto e compila
        id: build
        shell: bash
        run: |
          set -o pipefail
          {
            echo "=== flutter create ==="
            flutter create --org it.myfleet --project-name myfleetmanager --platforms android,ios . &&
            rm -rf test &&
            echo "=== patch ===" &&
            python3 tool/patch_android.py &&
            mkdir -p ~/.android && cp keystore/debug.keystore ~/.android/debug.keystore &&
            echo "=== pub get ===" &&
            flutter pub get &&
            echo "=== analyze ===" &&
            (flutter analyze --no-fatal-infos --no-fatal-warnings || true) &&
            echo "=== build ===" &&
            flutter build apk --release
          } 2>&1 | tee build.log
          VER=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)
          APK="MyFleetManager-v${VER}.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "$APK"
          echo "apk=$APK" >> "$GITHUB_OUTPUT"
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          echo "=== firma ===" >> build.log
          $(ls -d $ANDROID_HOME/build-tools/*/ | sort -V | tail -1)apksigner verify --print-certs "$APK" | grep -i "SHA-1" >> build.log || true

      - name: Pubblica APK nella pagina Releases
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.build.outputs.ver }}-build${{ github.run_number }}
          name: MyFleetManager ${{ steps.build.outputs.ver }} (build ${{ github.run_number }})
          body: |
            Scarica **${{ steps.build.outputs.apk }}** qui sotto e aprilo sul telefono Android per installarlo.
            Si installa sopra la versione precedente mantenendo i dati.
          files: ${{ steps.build.outputs.apk }}

      - name: Carica APK come artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MyFleetManager-v${{ steps.build.outputs.ver }}
          path: ${{ steps.build.outputs.apk }}

      - name: Salva log di compilazione (branch build-log)
        if: always()
        shell: bash
        run: |
          echo "result=${{ steps.build.outcome }} run=${{ github.run_number }} sha=${{ github.sha }}" > status.txt
          mkdir -p /tmp/logout && cp status.txt /tmp/logout/ && cp build.log /tmp/logout/ 2>/dev/null || true
          cd /tmp/logout
          git init -q -b build-log
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A && git commit -qm "log run ${{ github.run_number }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" build-log
