name: Prova versione web nei browser

on:
  push:
    branches: [main, ccr-e440b7a3-tzhb9h]
  workflow_dispatch:

jobs:
  browsers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.x'
          channel: stable
          cache: true

      - name: Compila
        run: |
          flutter create --org it.myfleet --project-name myfleetmanager --platforms web .
          rm -rf test
          python3 tool/patch_web.py
          flutter pub get
          flutter build web --profile --source-maps --no-web-resources-cdn

      - name: Prepara i browser
        run: |
          python3 -m pip install --break-system-packages -q playwright
          python3 -m playwright install --with-deps chromium firefox webkit
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri > /dev/null

      - name: Avvia il sito di prova
        run: |
          (cd build/web && python3 -m http.server 8765 > /dev/null 2>&1 &)
          sleep 2

      - name: Prova Chrome ed Edge (Chromium)
        run: HEADED=1 xvfb-run -a -s '-screen 0 1280x800x24' python3 tool/web_test/browser_test.py http://localhost:8765/ web-test/chromium chromium

      - name: Prova Firefox (indicativa, grafica software)
        continue-on-error: true
        run: HEADED=1 xvfb-run -a -s '-screen 0 1280x800x24' python3 tool/web_test/browser_test.py http://localhost:8765/ web-test/firefox firefox

      - name: Prova WebKit / Safari (indicativa, grafica software)
        continue-on-error: true
        run: HEADED=1 xvfb-run -a -s '-screen 0 1280x800x24' python3 tool/web_test/browser_test.py http://localhost:8765/ web-test/webkit webkit

      - name: Carica risultati e schermate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prova-browser
          path: web-test
