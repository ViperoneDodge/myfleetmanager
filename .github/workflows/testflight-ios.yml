name: iOS su TestFlight

on:
  workflow_dispatch:

jobs:
  testflight:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.x'
          channel: stable
          cache: true

      - name: Controlla le chiavi
        shell: bash
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          missing=""
          [ -n "$ASC_KEY_ID" ] || missing="$missing ASC_KEY_ID"
          [ -n "$ASC_ISSUER_ID" ] || missing="$missing ASC_ISSUER_ID"
          [ -n "$ASC_KEY_P8" ] || missing="$missing ASC_KEY_P8"
          if [ -n "$missing" ]; then
            echo "Mancano i secret:$missing"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/keys/AuthKey.p8"
          grep -q "BEGIN PRIVATE KEY" "$RUNNER_TEMP/keys/AuthKey.p8" || { echo "ASC_KEY_P8 non contiene una chiave .p8 completa"; exit 1; }
          K=$(printf '%s' "$ASC_KEY_ID" | tr -d '[:space:]')
          I=$(printf '%s' "$ASC_ISSUER_ID" | tr -d '[:space:]')
          echo "Lunghezza ASC_KEY_ID: ${#K} (deve essere 10)"
          echo "Lunghezza ASC_ISSUER_ID: ${#I} (deve essere 36)"

      - name: Prova la chiave API con Apple
        shell: bash
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          python3 -m venv "$RUNNER_TEMP/jwt"
          "$RUNNER_TEMP/jwt/bin/pip" install -q pyjwt cryptography
          "$RUNNER_TEMP/jwt/bin/python" - <<'PY'
          import json, os, time, urllib.request, urllib.error
          import jwt
          key = open(os.path.join(os.environ["RUNNER_TEMP"], "keys", "AuthKey.p8")).read()
          now = int(time.time())
          token = jwt.encode(
              {"iss": os.environ["ASC_ISSUER_ID"].strip(), "iat": now, "exp": now + 600, "aud": "appstoreconnect-v1"},
              key, algorithm="ES256", headers={"kid": os.environ["ASC_KEY_ID"].strip(), "typ": "JWT"},
          )
          req = urllib.request.Request(
              "https://api.appstoreconnect.apple.com/v1/apps?filter[bundleId]=it.myfleet.myfleetmanager",
              headers={"Authorization": "Bearer " + token},
          )
          try:
              data = json.load(urllib.request.urlopen(req))
              apps = [a["attributes"]["name"] for a in data.get("data", [])]
              print("Chiave API valida. App trovate:", apps or "nessuna")
          except urllib.error.HTTPError as e:
              print("Apple ha rifiutato la chiave API:", e.code, e.read().decode()[:400])
              raise SystemExit(1)
          PY

      - name: Prepara progetto iOS
        shell: bash
        run: |
          set -e
          flutter create --org it.myfleet --project-name myfleetmanager --platforms ios .
          rm -rf test
          flutter pub get
          flutter build ios --config-only --no-codesign --release || true
          python3 tool/patch_ios.py
          if [ -f tool/GoogleService-Info.plist ]; then cp tool/GoogleService-Info.plist ios/Runner/GoogleService-Info.plist; fi
          BUILD=$(grep '^version:' pubspec.yaml | sed 's/.*+//')
          flutter build ios --config-only --release --obfuscate --split-debug-info=build/symbols --build-number="$BUILD.${{ github.run_number }}"

      - name: Archivio firmato
        shell: bash
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          ASC_KEY_ID=$(printf '%s' "$ASC_KEY_ID" | tr -d '[:space:]')
          ASC_ISSUER_ID=$(printf '%s' "$ASC_ISSUER_ID" | tr -d '[:space:]')
          xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/Runner.xcarchive archive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" 2>&1 | tee archive.log | grep -E "error:|warning: .*sign|ARCHIVE" || true
          test -d build/Runner.xcarchive || { tail -80 archive.log; exit 1; }

      - name: Carica su TestFlight
        shell: bash
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          ASC_KEY_ID=$(printf '%s' "$ASC_KEY_ID" | tr -d '[:space:]')
          ASC_ISSUER_ID=$(printf '%s' "$ASC_ISSUER_ID" | tr -d '[:space:]')
          cat > ExportOptions.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>upload</string>
            <key>teamID</key>
            <string>C4WH22N952</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>uploadSymbols</key>
            <true/>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive -archivePath build/Runner.xcarchive \
            -exportOptionsPlist ExportOptions.plist -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" 2>&1 | tee export.log | tail -40

      - name: Cancella la chiave
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/keys"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: testflight-log
          path: |
            archive.log
            export.log
          if-no-files-found: ignore
