name: myfleetmanager
description: Gestione flotta di auto e moto con scadenze, notifiche e parco auto familiare.
publish_to: 'none'
version: 1.8.13+23

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  path_provider: ^2.1.5
  image_picker: ^1.1.2
  crypto: ^3.0.3
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.0
  flutter_timezone: ^3.0.1
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.0
  cloud_firestore: ^5.4.0
  firebase_messaging: ^15.1.3
  google_sign_in: ^6.2.1
  file_picker: ^8.1.2
  open_filex: ^4.6.0
  in_app_purchase: ^3.2.0
  image: ^4.2.0
  workmanager: ^0.10.0
  url_launcher: ^6.3.1
  device_info_plus: ^11.3.0
  in_app_update: ^4.2.3
  pdf: ^3.11.0
  printing: ^5.13.0
  google_mlkit_text_recognition: ^0.16.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/icon.png
    - assets/gian_trip_logo.png
    - assets/l10n/
    - assets/vehicles/
    - assets/fonts/NotoSans-Regular.ttf
    - assets/fonts/NotoSans-Bold.ttf
    - assets/fonts/NotoSansDevanagari-Regular.ttf
    - assets/fonts/NotoSansThai-Regular.ttf
  fonts:
    - family: PatrickHand
      fonts:
        - asset: assets/fonts/PatrickHand-Regular.ttf
